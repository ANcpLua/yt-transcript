name: release

# A tag builds, checks, and publishes a GitHub release with the four zips.
# Store submissions are a separate, explicit dispatch, because the three
# stores review on their own schedules and Chrome and Edge refuse uploads
# while a review or certification is open. `chrome: update` uploads the
# package without submitting it, so listing images can be swapped in the
# dashboard before the review starts.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      stores:
        description: Which stores to publish to
        type: choice
        default: all
        options: [all, edge, chrome, firefox]
      chrome:
        description: "Chrome: release (upload and submit) or update (upload only)"
        type: choice
        default: release
        options: [release, update]

permissions:
  contents: write

jobs:
  release:
    name: Build, check, and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile

      - name: Resolve version
        id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            VERSION=$(bunx store-publish version --tag "$GITHUB_REF_NAME")
          else
            VERSION=$(bunx store-publish version)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "notes=v$VERSION automated release" >> "$GITHUB_OUTPUT"

      - run: bun run lint
      - run: bun run test
      - run: bunx store-publish lint
      - run: bunx store-publish readme --check
      - name: Build and pack store zips
        run: bun run zip

      - name: Create GitHub release with store zips
        if: ${{ github.ref_type == 'tag' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" video-transcript-*.zip \
            --title "$GITHUB_REF_NAME" --generate-notes

      - name: Publish to Edge Add-ons
        if: ${{ github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","edge"]'), inputs.stores) }}
        env:
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
        run: bunx store-publish edge release --notes "${{ steps.v.outputs.notes }}"

      - name: Publish to Chrome Web Store
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","chrome"]'), inputs.stores) }}
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: bunx store-publish chrome ${{ inputs.chrome }}

      - name: Publish to Firefox Add-ons
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","firefox"]'), inputs.stores) }}
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: bunx store-publish firefox release --notes "${{ steps.v.outputs.notes }}" --source
