name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      stores:
        description: Which stores to publish to
        type: choice
        default: all
        options: [all, edge, chrome, firefox]

permissions:
  contents: write

jobs:
  release:
    name: Publish to Chrome, Edge, and Firefox stores
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile

      - name: Resolve version
        id: v
        run: |
          PKG=$(node -p "require('./package.json').version")
          MANIFEST=$(node -p "require('./manifest.json').version")
          FIREFOX=$(node -p "require('./manifest.firefox.json').version")
          if [ "$PKG" != "$MANIFEST" ] || [ "$PKG" != "$FIREFOX" ]; then
            echo "::error::version mismatch: package.json=$PKG manifest.json=$MANIFEST manifest.firefox.json=$FIREFOX"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$PKG" ]; then
              echo "::error::tag v$TAG does not match version $PKG"
              exit 1
            fi
          fi
          echo "version=$PKG" >> "$GITHUB_OUTPUT"
          echo "notes=v$PKG automated release" >> "$GITHUB_OUTPUT"

      - run: bun run lint
      - run: bun run test
      - run: bunx store-publish lint
      - run: bunx store-publish readme --check
      - name: Build and pack store zips
        run: bun run zip

      - name: Publish to Edge Add-ons
        if: ${{ contains(fromJSON('["all","edge"]'), inputs.stores || 'all') }}
        env:
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
        run: bunx store-publish edge release --notes "${{ steps.v.outputs.notes }}"

      - name: Publish to Chrome Web Store
        if: ${{ !cancelled() && contains(fromJSON('["all","chrome"]'), inputs.stores || 'all') }}
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: bunx store-publish chrome release

      - name: Publish to Firefox Add-ons
        if: ${{ !cancelled() && contains(fromJSON('["all","firefox"]'), inputs.stores || 'all') }}
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: bunx store-publish firefox release --notes "${{ steps.v.outputs.notes }}" --source

      - name: Create GitHub release with store zips
        if: ${{ !cancelled() && github.ref_type == 'tag' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" video-transcript-*.zip \
            --title "$GITHUB_REF_NAME" --generate-notes
