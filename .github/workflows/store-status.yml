name: store-status

# Read-only: nothing here uploads or publishes, except `amo-listing-apply`,
# which writes the description from store/listing.md to Firefox Add-ons.

on:
  workflow_dispatch:
    inputs:
      store:
        description: Which store to query (read-only unless amo-listing-apply)
        type: choice
        default: chrome
        options: [chrome, firefox, edge, amo-listing-diff, amo-listing-apply]

permissions: {}

jobs:
  status:
    name: Fetch store item status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.11.0
          cache: npm
      - run: npm ci

      - name: Chrome Web Store status
        if: ${{ inputs.store == 'chrome' }}
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: npx store-publish chrome status

      - name: Firefox Add-ons status
        if: ${{ inputs.store == 'firefox' }}
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: npx store-publish firefox status

      - name: Edge credential probe and key expiry
        if: ${{ inputs.store == 'edge' }}
        env:
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
        run: npx store-publish edge status

      - name: AMO listing diff
        if: ${{ inputs.store == 'amo-listing-diff' }}
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: npx store-publish amo-listing diff

      - name: AMO listing apply
        if: ${{ inputs.store == 'amo-listing-apply' }}
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: npx store-publish amo-listing apply
