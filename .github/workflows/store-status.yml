name: store-status

on:
  workflow_dispatch:
    inputs:
      store:
        description: Which store to query (read-only, publishes nothing)
        type: choice
        default: chrome
        options: [chrome, firefox, amo-listing-diff, amo-listing-apply]

permissions: {}

jobs:
  status:
    name: Fetch store item status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.11.0

      - name: Chrome Web Store status
        if: ${{ inputs.store == 'chrome' }}
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ secrets.CWS_ITEM_ID }}
        run: node scripts/publish/publish-chrome.mjs status

      - name: Firefox Add-ons status
        if: ${{ inputs.store == 'firefox' }}
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: node scripts/publish/publish-firefox.mjs status

      - name: AMO listing diff (read-only)
        if: ${{ inputs.store == 'amo-listing-diff' }}
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: node scripts/publish/update-amo-listing.mjs diff

      - name: AMO listing apply
        if: ${{ inputs.store == 'amo-listing-apply' }}
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: node scripts/publish/update-amo-listing.mjs apply
