<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#f2ecff"/>
      <stop offset="0.55" stop-color="#ded2fb"/>
      <stop offset="1" stop-color="#bda7f2"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#f0abfc"/>
      <stop offset="0.45" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>

    <filter id="glowRing" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowWave" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#3b0764" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- neon orbit behind the page -->
  <g filter="url(#glowRing)" opacity="0.95">
    <ellipse cx="512" cy="652" rx="376" ry="150"
             fill="none" stroke="url(#ring)" stroke-width="26"
             transform="rotate(-13 512 652)"/>
  </g>

  <!-- sparkles -->
  <g fill="#e9d5ff" opacity="0.9">
    <circle cx="196" cy="300" r="15"/>
    <circle cx="842" cy="266" r="12"/>
    <circle cx="150" cy="486" r="9"/>
    <circle cx="884" cy="470" r="8"/>
  </g>
  <g fill="#67e8f9" opacity="0.85">
    <circle cx="248" cy="214" r="9"/>
    <circle cx="790" cy="372" r="7"/>
  </g>

  <!-- document -->
  <g filter="url(#softShadow)">
    <path d="M286 196
             a48 48 0 0 1 48-48
             h268 l166 166
             v466 a48 48 0 0 1-48 48
             H334 a48 48 0 0 1-48-48 Z"
          fill="url(#page)" stroke="url(#edge)" stroke-width="14" stroke-linejoin="round"/>
    <path d="M602 148 l166 166 h-118 a48 48 0 0 1-48-48 Z"
          fill="url(#fold)" stroke="url(#edge)" stroke-width="12" stroke-linejoin="round"/>
  </g>

  <!-- text lines -->
  <g fill="url(#line)">
    <rect x="366" y="374" width="300" height="30" rx="15"/>
    <rect x="366" y="452" width="252" height="30" rx="15"/>
    <rect x="366" y="530" width="288" height="30" rx="15"/>
  </g>

  <!-- waveform across the lower page -->
  <g filter="url(#glowWave)">
    <path d="M330 664 L372 664 L396 604 L424 726 L452 570 L480 700 L508 620 L536 690 L562 646 L600 646"
          fill="none" stroke="url(#wave)" stroke-width="22"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- check badge -->
  <g filter="url(#softShadow)">
    <circle cx="712" cy="702" r="126" fill="url(#badge)" stroke="#f5f3ff" stroke-width="16"/>
    <path d="M652 704 l42 44 84 -96" fill="none" stroke="#ffffff"
          stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
