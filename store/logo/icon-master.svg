<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#3b1a72"/>
      <stop offset="1" stop-color="#1e0b3d"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#faf7ff"/>
      <stop offset="1" stop-color="#d7c8fb"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38e8ff"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#tile)"/>

  <!-- document, filling most of the tile -->
  <path d="M112 128
           a34 34 0 0 1 34-34
           h150 l110 110
           v218 a34 34 0 0 1-34 34
           H146 a34 34 0 0 1-34-34 Z"
        fill="url(#page)"/>
  <path d="M296 94 l110 110 h-76 a34 34 0 0 1-34-34 Z" fill="url(#fold)"/>

  <!-- text lines: heavy enough to survive 16px -->
  <g fill="#6d28d9">
    <rect x="152" y="196" width="196" height="26" rx="13"/>
    <rect x="152" y="248" width="150" height="26" rx="13"/>
  </g>

  <!-- bold waveform -->
  <path d="M150 348 L184 348 L206 300 L230 396 L254 282 L278 380 L302 320 L326 348 L360 348"
        fill="none" stroke="url(#wave)" stroke-width="26"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- check badge -->
  <circle cx="376" cy="376" r="96" fill="url(#badge)" stroke="#1e0b3d" stroke-width="20"/>
  <path d="M332 378 l30 32 60 -70" fill="none" stroke="#ffffff"
        stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
